server:
  port: ${PORT:8082}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: api_gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:${AUTH_SERVER_URL:http://localhost:8083}}
  cloud:
    gateway:
      httpserver:
        wiretap: true
      httpclient:
        wiretap: true
        connect-timeout: 3000ms
        response-timeout: 5s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: authorization-server
          uri: ${AUTH_SERVER_URL:http://localhost:8083}
          predicates:
            - Path=/oauth2/**, /login, /login/**, /register, /register/**, /userinfo, /userinfo/**, /.well-known/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "${LOG_PATTERN_CONSOLE:%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n}"
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.capo.api_gateway: ${LOGGING_LEVEL_APP:INFO}
    org.springframework.cloud.gateway: ${LOGGING_LEVEL_GATEWAY:INFO}
    org.springframework.security: ${LOGGING_LEVEL_SECURITY:INFO}
    org.springframework.http.server.reactive: ${LOGGING_LEVEL_REACTIVE:INFO}
    org.springframework.web.reactive: ${LOGGING_LEVEL_REACTIVE:INFO}
    reactor.netty: ${LOGGING_LEVEL_NETTY:INFO}
    reactor.netty.http.server.HttpServerOperations: TRACE
    reactor.netty.channel.FluxReceive: TRACE