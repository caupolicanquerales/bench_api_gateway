server:
  port: ${PORT:8082}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: api_gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:${AUTH_SERVER_URL:http://localhost:8083}/.well-known/jwks.json}
  cloud:
    gateway:
      httpserver:
        wiretap: true
      httpclient:
        wiretap: true
        connect-timeout: 3000ms
        response-timeout: 5s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: authorization-server
          uri: ${AUTH_SERVER_URL:http://localhost:8083}
          predicates:
            - Path=/oauth2/**, /login, /login/**, /register, /register/**, /userinfo, /userinfo/**, /.well-known/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.capo.api_gateway: ${LOGGING_LEVEL_APP:INFO}
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    org.springframework.http.server.reactive: INFO
    org.springframework.web.reactive: INFO
    reactor.netty: INFO