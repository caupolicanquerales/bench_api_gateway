server:
  port: ${PORT:8082}
  forward-headers-strategy: framework
  shutdown: graceful

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://bench-frontend.onrender.com}

spring:
  application:
    name: api_gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:${AUTH_SERVER_URL:http://localhost:8083}/oauth2/jwks}
  cloud:
    gateway:
      server:
        webflux:
          httpserver:
            wiretap: true
          httpclient:
            wiretap: true
            connect-timeout: 10000
            response-timeout: 120s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            - id: auth-server-well-known
              uri: ${AUTH_SERVER_URL:http://localhost:8083}
              predicates:
                - Path=/.well-known/openid-configuration, /.well-known/jwks.json, /.well-known/**
            - id: authorization-server
              uri: ${AUTH_SERVER_URL:http://localhost:8083}
              predicates:
                - Path=/oauth2/**, /login, /login/**, /register, /register/**, /logout, /logout/**, /userinfo/**
            - id: garmin-processor-server
              uri: ${GARMIN_SERVER_URL:http://localhost:8084}
              predicates:
                - Path=/garmin-file/**, /garmin-data/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.capo.api_gateway: ${LOGGING_LEVEL_APP:INFO}
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
    org.springframework.http.server.reactive: INFO
    org.springframework.web.reactive: INFO
    reactor.netty: INFO
    reactor.netty.http.server.HttpServer: DEBUG
    reactor.netty.http.client.HttpClient: DEBUG