server:
  port: ${PORT:8082}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: api_gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:${AUTH_SERVER_URL:http://localhost:8083}/oauth2/jwks}
  cloud:
    gateway:
      server:
        webflux:
          httpserver:
            wiretap: true
          httpclient:
            wiretap: true
            connect-timeout: 3000
            response-timeout: 5s
          # Global CORS Configuration for Frontend (Angular)
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                  - "https://bench-frontend.onrender.com"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            - id: auth-server-well-known
              uri: ${AUTH_SERVER_URL:http://localhost:8083}
              predicates:
                - Path=/.well-known/openid-configuration, /.well-known/jwks.json, /.well-known/**
            - id: authorization-server
              uri: ${AUTH_SERVER_URL:http://localhost:8083}
              predicates:
                - Path=/oauth2/**, /login/**, /register/**, /userinfo/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.capo.api_gateway: ${LOGGING_LEVEL_APP:INFO}
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
    org.springframework.http.server.reactive: INFO
    org.springframework.web.reactive: INFO
    reactor.netty: INFO
    reactor.netty.http.server.HttpServer: DEBUG
    reactor.netty.http.client.HttpClient: DEBUG